name: Patch Odontologia and Vigilante 2026

on:
  push:
    paths:
      - '.github/workflows/patch-odonto-vigilante.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Odontologia and add Vigilante block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re

          p = Path("index.html")
          html = p.read_text(encoding="utf-8")
          changed = []

          def lesson(area, n, vid, title, note):
              embed = f"https://www.youtube.com/embed/{vid}"
              yt = f"https://www.youtube.com/watch?v={vid}"
              return (
                  f'<button class="lesson-item" type="button" data-area="{area}" '
                  f'data-embed="{embed}" data-title="{title}" data-note="{note}" data-yt="{yt}">'
                  f'<span class="lesson-mark">▶</span><span class="lesson-text">'
                  f'<strong>Aula {n:02d} • {title}</strong><small>{note}</small></span>'
                  f'<span class="lesson-open lesson-status">Livre</span></button>'
              )

          def pdf_item(url, mark, title, note):
              return (
                  f'<a class="pdf-item" href="{url}" target="_blank" rel="noopener">'
                  f'<span class="pdf-mark">{mark}</span><span class="lesson-text">'
                  f'<strong>{title}</strong><small>{note}</small></span>'
                  f'<span class="lesson-open">Abrir</span></a>'
              )

          # ---------------- ODONTOLOGIA ----------------
          os = html.find('<section class="area" id="area-odontologia">')
          oe = html.find('<section class="area"', os + 10) if os >= 0 else -1
          if os >= 0:
              if oe < 0:
                  oe = html.find('</main>', os)
              sec = html[os:oe]

              odonto_marker = 'jr-odonto-semusa-aulas-extra-20261003'
              if odonto_marker not in sec:
                  extra_lessons = (
                      f'<span id="{odonto_marker}" hidden></span>'
                      + lesson("odontologia",44,"0sgDDX9Z_Lg","Mecanismo de ação do flúor","Uso do flúor na prevenção e tratamento da cárie; foco expresso no edital SEMUSA/IBGP.")
                      + lesson("odontologia",45,"fmzruRUzyFc","Fluorose dentária","Aspectos clínicos e epidemiológicos da fluorose, conforme conteúdo programático.")
                      + lesson("odontologia",46,"WlehIU6BkJA","Manifestações bucais de doenças sistêmicas","Revisão de manifestações orais associadas a condições sistêmicas.")
                      + lesson("odontologia",47,"POurGrQbl28","Alveoloplastia","Reforço dos procedimentos cirúrgicos previstos no edital: extrações e alveoloplastia.")
                      + lesson("odontologia",48,"TdlgCMJ3jHg","Lei 8.080/1990","Organização, princípios e funcionamento do SUS para concursos.")
                      + lesson("odontologia",49,"8H6dhR0lBS8","Lei 8.142/1990","Participação social e transferências intergovernamentais no SUS.")
                      + lesson("odontologia",50,"G7idwHauTlQ","PNAB • Portaria 2.436/2017","Política Nacional de Atenção Básica, conteúdo expresso no edital.")
                      + lesson("odontologia",51,"lv3O6FVonYQ","PNAB • questões de prova","Questões comentadas para fixação da Portaria 2.436/2017.")
                  )

                  last_title = 'Aula 43 - Banca IDECAN: Conteúdos Mais Cobrados na Odontologia'
                  lp = sec.find(last_title)
                  if lp < 0:
                      raise SystemExit("Não foi possível localizar a última aula de Odontologia")
                  end_button = sec.find('</button>', lp)
                  if end_button < 0:
                      raise SystemExit("Fim da Aula 43 de Odontologia não encontrado")
                  end_button += len('</button>')
                  sec = sec[:end_button] + extra_lessons + sec[end_button:]

                  # Atualiza contagens e descrição sem tocar em outras áreas.
                  sec = sec.replace('🦷 Odontologia • 43 aulas', '🦷 Odontologia • 51 aulas', 1)
                  sec = sec.replace('com 40 aulas para concursos da área odontológica', 'com 51 aulas para concursos da área odontológica', 1)
                  sec = sec.replace('<strong>Aulas da área</strong><span>43 aulas</span>', '<strong>Aulas da área</strong><span>51 aulas</span>', 1)
                  sec = sec.replace('0 de 43 concluídas', '0 de 51 concluídas', 1)
                  changed.append("odontologia-aulas")

              sb_marker = 'jr-sbbrasil-2010-oficial-20261003'
              if sb_marker not in sec:
                  sb = (
                      f'<span id="{sb_marker}" hidden></span>'
                      + pdf_item(
                          "https://bvsms.saude.gov.br/bvs/publicacoes/pesquisa_nacional_saude_bucal_sbbrasil_2010.pdf",
                          "PDF",
                          "SB Brasil 2010 • Relatório Final",
                          "Ministério da Saúde • PDF oficial • tópico expresso no edital do cargo 514"
                      )
                  )
                  q = sec.find('Responda aqui: Questões do SUS')
                  if q >= 0:
                      qend = sec.find('</a>', q)
                      if qend >= 0:
                          qend += len('</a>')
                          sec = sec[:qend] + sb + sec[qend:]
                          changed.append("odontologia-sbbrasil")
                  else:
                      raise SystemExit("Caixa de documentos de Odontologia não localizada")

              html = html[:os] + sec + html[oe:]

          # ---------------- VIGILANTE / CANDEIAS ----------------
          vig_marker = 'jr-vigilante-candeias-20261003'
          if vig_marker not in html:
              svg = '''<svg xmlns="http://www.w3.org/2000/svg" width="640" height="960" viewBox="0 0 640 960">
              <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#163b63"/></linearGradient></defs>
              <rect width="640" height="960" fill="url(#g)"/>
              <circle cx="320" cy="330" r="145" fill="#0b1d31" stroke="#38bdf8" stroke-width="10"/>
              <path d="M320 205l105 40v92c0 76-47 137-105 170-58-33-105-94-105-170v-92z" fill="#0f2742" stroke="#e2e8f0" stroke-width="8"/>
              <path d="M270 337l33 34 72-82" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
              <text x="320" y="570" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="48" font-weight="700">VIGILÂNCIA</text>
              <text x="320" y="625" text-anchor="middle" fill="#bae6fd" font-family="Arial,sans-serif" font-size="28">Candeias do Jamari • IBGP</text>
              <text x="320" y="770" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="24">JR APROVA</text>
              </svg>'''
              card_img = "data:image/svg+xml;base64," + base64.b64encode(svg.encode()).decode()

              card = f'''
              <article class="card jr-approved-art-card jr-card-vigilante" id="{vig_marker}" onclick="openGate('vigilante')" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){{event.preventDefault();openGate('vigilante')}}" aria-label="Acessar Agente de Segurança e Vigilância">
                <img src="{card_img}" alt="Agente de Segurança e Vigilância • Candeias do Jamari" width="640" height="960" decoding="async" loading="lazy">
                <div class="card-shade"></div>
                <div class="card-body">
                  <span class="tag">Câmara de Candeias do Jamari • IBGP</span>
                  <h3>Agente de Segurança e Vigilância</h3>
                  <p>Preparatório do cargo 201 com conhecimentos específicos, legislação municipal, materiais oficiais, videoaulas e revisão direcionada ao Edital 01/2026.</p>
                  <button class="card-btn" type="button" tabindex="-1">Acessar</button>
                </div>
              </article>
              '''
              penal_card = html.find('<article class="card jr-approved-art-card jr-card-penal"')
              if penal_card < 0:
                  raise SystemExit("Card da Polícia Penal não encontrado para inserir Vigilante")
              html = html[:penal_card] + card + html[penal_card:]

              vig_lessons = (
                  lesson("vigilante",1,"l1-IxnQ91hg","Controle de acesso","Procedimentos de entrada, saída, identificação e controle de permanência.")
                  + lesson("vigilante",2,"rm-1WXI9TAg","Rondas e vigilância patrimonial","Rondas de inspeção, observação do patrimônio e identificação de pontos vulneráveis.")
                  + lesson("vigilante",3,"NDSsD9AyYBA","Prevenção e combate a incêndio","Noções práticas sobre prevenção, resposta inicial e uso de extintores.")
                  + lesson("vigilante",4,"E5aT72zDcco","Extintores de incêndio","Classes, agentes extintores e procedimentos básicos em princípio de incêndio.")
                  + lesson("vigilante",5,"lJxXQb7t8PQ","Ética no serviço público e atendimento","Conduta, postura profissional, relações humanas e atendimento ao cidadão.")
              )

              focus = [
                  ("01","Sessões plenárias e controle de acesso","Protocolos durante sessões; permanência de público, autoridades e servidores; atuação conforme determinações da Presidência."),
                  ("02","Disciplina, hierarquia e conduta","Subordinação funcional, ética do servidor e cumprimento de ordens e determinações superiores."),
                  ("03","Rondas e vigilância patrimonial","Planejamento de rondas, pontos vulneráveis, registro e comunicação de ocorrências."),
                  ("04","Prevenção a furtos e roubos","Observação preventiva, procedimentos diante de tentativa de invasão e acionamento dos órgãos de segurança."),
                  ("05","Incêndio e evacuação","Prevenção, extintores, rotas de fuga, evacuação e acionamento do Corpo de Bombeiros."),
                  ("06","Ordem, atendimento e segurança institucional","Monitoramento de acessos e movimentação, relações humanas e apoio à segurança do Poder Legislativo Municipal."),
              ]
              focus_html = ''.join(
                  f'<div class="lesson-item" style="cursor:default"><span class="lesson-mark">{n}</span><span class="lesson-text"><strong>{t}</strong><small>{d}</small></span><span class="lesson-open">Edital</span></div>'
                  for n,t,d in focus
              )

              docs = (
                  pdf_item("https://novo.ibgpconcursos.com.br/concurso.jsp?cod=784","EDITAL","Concurso Câmara de Candeias do Jamari • Edital 01/2026","Página oficial da banca IBGP")
                  + pdf_item("https://www.candeiasdojamari.ro.leg.br/leis/lei-organica-municipal/lei-organica-do-municipio-de-candeias-do-jamari/at_download/file","PDF","Lei Orgânica de Candeias do Jamari","Documento oficial da Câmara Municipal")
                  + pdf_item("https://legislacao.candeiasdojamari.ro.leg.br/consolidacao/1/","LEI","Regimento Interno • Resolução nº 001/CMCJ-93","Portal oficial da legislação da Câmara • versão consolidada/atualizada")
                  + pdf_item("https://legislacao.candeiasdojamari.ro.leg.br/","LEI","Resolução nº 173/CMCJ/2025","Portal oficial da legislação da Câmara • quadro efetivo de cargos e remunerações")
                  + pdf_item("https://www.gov.br/pf/pt-br/assuntos/seguranca-privada/legislacao-normas-e-orientacoes/manual-do-vigilante/manual-do-vigilante/manual_vigilante.zip/@@download/file/manual_do_vigilante_2a_edic-retificado.pdf","PDF","Manual do Vigilante • Polícia Federal","Material oficial de apoio para rondas, controle de acesso, comunicação e vigilância patrimonial")
                  + pdf_item("https://www.gov.br/pf/pt-br/assuntos/seguranca-privada/legislacao-normas-e-orientacoes/portarias/portaria-no-16-cgcsp_dpa_pf-de-1o-de-agosto-de-2024-portaria-no-16-cgcsp_dpa_pf-de-1o-de-agosto-de-2024-dou-imprensa-nacional.pdf/@@download/file","PDF","Prevenção e combate a incêndios • Polícia Federal","Referência oficial sobre extintores, evacuação e procedimentos em incêndios")
              )

              section = f'''
              <section class="area" id="area-vigilante">
                <div class="area-top">
                  <div class="area-head">
                    <div class="jr-area-icon" aria-hidden="true">🛡️</div>
                    <div>
                      <span class="mini-tag">Câmara de Candeias do Jamari/RO • IBGP • Cargo 201</span>
                      <h2>Agente de Segurança e Vigilância</h2>
                      <p>Trilha direcionada ao Edital nº 01/2026, com conhecimentos específicos, legislação municipal e materiais oficiais para a prova da banca IBGP.</p>
                    </div>
                  </div>
                </div>
                <div class="area-content">
                  <div class="area-grid">
                    <div class="player-box">
                      <div class="box-head"><strong>Videoaula atual</strong><span>Player integrado</span></div>
                      <div class="video-wrap"><iframe id="player-vigilante" src="https://www.youtube.com/embed/l1-IxnQ91hg" title="Agente de Segurança e Vigilância" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>
                      <div class="player-meta"><strong id="title-vigilante">Controle de acesso</strong><small id="note-vigilante">Procedimentos de entrada, saída, identificação e controle de permanência.</small><a id="link-vigilante" href="https://www.youtube.com/watch?v=l1-IxnQ91hg" target="_blank" rel="noopener">Ver no YouTube</a></div>
                      <div class="module-progress"><div class="progress-top"><strong>Seu progresso</strong><span id="progress-text-vigilante">0 de 5 concluídas</span></div><div class="progress-bar"><div class="progress-fill" id="progress-fill-vigilante"></div></div></div>
                      <div class="continue-wrap"><button class="continue-btn" type="button" onclick="continueFromLast('vigilante')">Continuar de onde parou</button></div>
                    </div>
                    <div class="list-box">
                      <div class="box-head"><strong>Aulas da área</strong><span>5 aulas essenciais</span></div>
                      <div class="scroll-list">{vig_lessons}</div>
                    </div>
                  </div>
                  <div class="area-grid" style="padding-top:0">
                    <div class="list-box">
                      <div class="box-head"><strong>🎯 Foco do edital • Cargo 201</strong><span>IBGP 2026</span></div>
                      <div class="scroll-list">{focus_html}</div>
                    </div>
                    <div class="list-box">
                      <div class="box-head"><strong>📚 PDFs e legislação oficial</strong><span>6 materiais</span></div>
                      <div class="scroll-list">{docs}</div>
                    </div>
                  </div>
                </div>
              </section>
              '''
              main_end = html.find('</main>')
              if main_end < 0:
                  raise SystemExit("Fechamento </main> não encontrado")
              html = html[:main_end] + section + html[main_end:]

              # adiciona configuração de acesso
              cfg_marker = 'vigilante: { title: "Agente de Segurança e Vigilância'
              if cfg_marker not in html:
                  close_cfg = html.find('\n};', html.find('const areaConfig'))
                  if close_cfg < 0:
                      raise SystemExit("areaConfig não encontrado")
                  cfg = '  vigilante: { title: "Agente de Segurança e Vigilância • Candeias do Jamari", password: "VIGIA2026", sectionId: "area-vigilante", storageKey: "jr_especifica_vigilante" },\n'
                  html = html[:close_cfg] + '\n' + cfg + html[close_cfg:]

              changed.append("vigilante-candeias")

          # Sanidade
          required = [
              'id="area-odontologia"',
              'jr-odonto-semusa-aulas-extra-20261003',
              'jr-sbbrasil-2010-oficial-20261003',
              'id="area-vigilante"',
              "openGate('vigilante')",
              'vigilante: { title: "Agente de Segurança e Vigilância'
          ]
          for token in required:
              if token not in html:
                  raise SystemExit("Falha de sanidade: " + token)

          if changed:
              p.write_text(html, encoding="utf-8")
              print("Atualizados:", ", ".join(changed))
          else:
              print("Nenhuma alteração necessária.")
          PY

      - name: Commit patched index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git config user.name "JR Aprova Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade Odontologia SEMUSA and add Vigilante Candeias block"
          git push origin main
