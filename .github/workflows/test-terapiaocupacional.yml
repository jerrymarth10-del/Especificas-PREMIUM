name: Terapia Ocupacional — integration smoke test
on:
  push:
    branches:
      - codex/terapiaocupacional-20261012
  workflow_dispatch:

permissions:
  contents: read

jobs:
  access-and-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout Especificas Premium (branch under test)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: Especificas-PREMIUM
          persist-credentials: false
      - name: Checkout sesau-certo (matching feature branch)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: jerrymarth10-del/sesau-certo
          ref: codex/terapiaocupacional-20261012
          path: sesau-certo
          persist-credentials: false
      - name: Checkout SEMUSA-SESAU-APP (matching feature branch)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: jerrymarth10-del/SEMUSA-SESAU-APP
          ref: codex/terapiaocupacional-20261012
          path: SEMUSA-SESAU-APP
          persist-credentials: false
      - name: Integration test (isolated mocks, no real payments)
        run: node Especificas-PREMIUM/scripts/test-terapiaocupacional.cjs
      - name: Render Projeto 1 with new card (anonymous regression)
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const handler=require('./sesau-certo/api/inject-quimica.js');
          const res={statusCode:200,headers:{},setHeader(k,v){this.headers[k]=v},end(v){this.body=v;return this}};
          Promise.resolve(handler({method:'GET',headers:{},query:{}},res)).then(()=>{
            assert.equal(res.statusCode,200,'Projeto 1 must render without 500');
            assert.match(res.body,/data-jr-card="terapiaocupacional"/);
            assert.match(res.body,/\/api\/area-entry\?area=terapiaocupacional/);
            assert.match(res.body,/data-jr-card="servicosgerais"/);
            console.log('Projeto 1 render and legacy cards: PASS');
          }).catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Live production GET checks (read only; no payments)
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          async function get(label,url,{accept=[200],redirect='follow'}={}){
            const res=await fetch(url,{method:'GET',redirect,signal:AbortSignal.timeout(20000),headers:{'User-Agent':'JR-Aprova-readonly-smoke/1.0'}});
            const body=await res.text();
            console.log(JSON.stringify({label,status:res.status,finalHost:new URL(res.url).host,bytes:body.length,redirect:res.headers.get('location')}));
            assert.ok(accept.includes(res.status),label+' unexpected HTTP status '+res.status);
            return {res,body};
          }
          (async()=>{
            const landing=await get('SEMUSA landing','https://semusa-sesau-app.vercel.app/');
            assert.match(landing.body, /name="area" value="terapiaocupacional"/,'Landing production missing Terapia Ocupacional');
            assert.match(landing.body,/\/api\/checkout/,'Landing production missing checkout route');
            const geral=await get('Projeto 1','https://sesau-certo.vercel.app/');
            assert.match(geral.body,/terapiaocupacional/,'Projeto 1 does not show new area');
            const especificas=await get('Projeto 2','https://especificas-premium.vercel.app/');
            assert.match(especificas.body,/terapiaocupacional/,'Projeto 2 does not show new area');
            const unauthorized=await get('Projeto 2 access without session','https://especificas-premium.vercel.app/api/access?area=terapiaocupacional',{accept:[200,401,403]});
            assert.ok(!/"allowed"\s*:\s*true/.test(unauthorized.body),'Anonymous authorization was granted');
            const entry=await get('Projeto 1 study entry without session','https://sesau-certo.vercel.app/api/study-entry',{accept:[301,302,303,307,308],redirect:'manual'});
            assert.ok(entry.res.headers.get('location'),'No redirect for anonymous user');
            console.log('LIVE READ-ONLY SMOKE: PASS. No checkout/order/payment/real purchase was made.');
          })().catch(e=>{console.error('LIVE READ-ONLY SMOKE FAILED:',e.message);process.exitCode=1;});
          NODE
