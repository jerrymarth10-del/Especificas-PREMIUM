name: Patch IBGP health blocks

on:
  push:
    paths:
      - '.github/workflows/patch-ibgp-health.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add IBGP exam pairs by health role
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path("index.html")
          html=p.read_text(encoding="utf-8")
          E="https://eticaconcursos.com.br/provas/arquivos"

          def item(url,title,note,kind):
              return f'<a class="pdf-item" href="{url}" target="_blank" rel="noopener"><span class="pdf-mark">{kind}</span><span class="lesson-text"><strong>{title}</strong><small>{note}</small></span><span class="lesson-open">Abrir</span></a>'

          def block(marker,title,items):
              return f'<div class="list-box" id="{marker}"><div class="box-head"><strong>📝 {title}</strong><span>Prova + gabarito</span></div><div class="scroll-list">{"".join(items)}</div></div>'

          def add(area,marker,markup):
              global html
              if f'id="{marker}"' in html:
                  return False
              start=html.find(f'<section class="area" id="area-{area}">')
              if start < 0:
                  print("AVISO área ausente:", area)
                  return False
              end=html.find("</section>",start)
              if end < 0:
                  raise SystemExit("Fim de seção ausente: "+area)
              html=html[:end]+markup+html[end:]
              return True

          # Substitui a caixa antiga de Farmácia para não duplicar o par já publicado.
          fs=html.find('<section class="area" id="area-farmaceutico">')
          fe=html.find("</section>",fs) if fs >= 0 else -1
          if fs >= 0 and fe > fs:
              sec=html[fs:fe]
              sec2=re.sub(
                  r'<div class="list-box">\s*<div class="box-head"><strong>📝 IBGP • Provas anteriores de Farmácia</strong><span>Prova \+ gabarito</span></div>\s*<div class="scroll-list">[\s\S]*?</div>\s*</div>\s*',
                  '',
                  sec,
                  count=1
              )
              if sec2 != sec:
                  html=html[:fs]+sec2+html[fe:]

          changed=[]

          # Odontologia • SEMUSA Porto Velho • Edital 25/2026
          # Preserva aulas existentes e troca apenas documentos/foco/provas.
          os=html.find('<section class="area" id="area-odontologia">')
          oe=html.find("</section>",os) if os >= 0 else -1
          if os >= 0 and oe > os:
              sec=html[os:oe]
              sec=sec.replace(
                  '<h2>Odontologia</h2>',
                  '<h2>Odontologia • SEMUSA Porto Velho • IBGP</h2>',
                  1
              )
              sec=sec.replace(
                  '<div class="box-head"><strong>PDFs</strong><span>1 arquivo(s)</span></div>',
                  '<div class="box-head"><strong>Documentos e treino</strong><span>SEMUSA 2026</span></div>',
                  1
              )
              old_edital='<a class="pdf-item" href="https://rondonia.ro.gov.br/wp-content/uploads/2017/01/013-Abertura-Concurso-Publico-SESAU-RO-2017-Atualizado.pdf" target="_blank" rel="noopener"><span class="pdf-mark">PDF</span><span class="lesson-text"><strong>Edital SESAU RO 2017</strong><small>Referência oficial do concurso organizado pela FUNRIO</small></span><span class="lesson-open">Abrir</span></a>'
              new_edital='<a class="pdf-item" href="https://www.diariomunicipal.com.br/arom/materia/12E00984" target="_blank" rel="noopener"><span class="pdf-mark">EDITAL</span><span class="lesson-text"><strong>SEMUSA Porto Velho • Edital nº 25/2026</strong><small>Cargo 514 — Odontólogo • referência oficial</small></span><span class="lesson-open">Abrir</span></a>'
              sec=sec.replace(old_edital,new_edital,1)
              old_ibgp=sec.find('<div class="list-box" id="jr-ibgp-odonto-20261002">')
              if old_ibgp >= 0:
                  old_ibgp_end=sec.find('</div></div>',old_ibgp)
                  if old_ibgp_end < 0:
                      raise SystemExit("Fim do bloco IBGP antigo de Odontologia não encontrado")
                  sec=sec[:old_ibgp]+'<span id="jr-ibgp-odonto-20261002" hidden></span>'+sec[old_ibgp_end+12:]
              if 'id="jr-semusa-odonto-20261003"' not in sec:
                  focus=[
                      ("01","Saúde bucal e epidemiologia","SB Brasil 2010; cárie, doença periodontal e câncer bucal; diagnóstico, tratamento, prevenção e controle."),
                      ("02","Flúor, fluorose e promoção de saúde","Uso do flúor, métodos coletivos, fluorose dentária, educação em saúde e ações coletivas."),
                      ("03","Biossegurança e controle de infecção","Biossegurança, ergonomia e controle de infecção aplicados à prática odontológica."),
                      ("04","Cirurgia odontológica","Extrações simples e com odontosecção, alveoloplastia, biópsias, suturas e drenagens."),
                      ("05","Dentística e materiais","Preparo de cavidades, proteção do complexo pulpodentário e materiais restauradores."),
                      ("06","Estomatologia e doenças sistêmicas","Patologias intra e extraósseas, diagnóstico, tratamento e manifestações bucais de doenças sistêmicas."),
                      ("07","Farmacologia, SUS e ética","Terapêutica, dor, receituário, Lei 8.080/1990, Lei 8.142/1990, Portaria 2.436/2017 e Código de Ética."),
                  ]
                  focus_html="".join(
                      f'<div class="lesson-item" style="cursor:default"><span class="lesson-mark">{n}</span><span class="lesson-text"><strong>{t}</strong><small>{d}</small></span><span class="lesson-open">Edital</span></div>'
                      for n,t,d in focus
                  )
                  pci=[
                      ("https://www.pciconcursos.com.br/provas/download/tecnico-superior-de-saude-cirurgiao-prefeitura-itabira-mg-ibgp-2018","Técnico Superior de Saúde — Cirurgião — Itabira/MG","IBGP • 2018"),
                      ("https://www.pciconcursos.com.br/provas/download/tecnico-superior-de-saude-cirurgiao-oral-prefeitura-itabira-mg-ibgp-2018","Técnico Superior de Saúde — Cirurgião Oral — Itabira/MG","IBGP • 2018"),
                      ("https://www.pciconcursos.com.br/provas/download/tecnico-superior-de-saude-cirurgiao-psf-prefeitura-itabira-mg-ibgp-2018","Técnico Superior de Saúde — Cirurgião PSF — Itabira/MG","IBGP • 2018"),
                      ("https://www.pciconcursos.com.br/provas/download/cirurgiao-dentista-de-familia-e-comunidade-prefeitura-lagoa-santa-mg-ibgp-2015","Cirurgião Dentista de Família e Comunidade — Lagoa Santa/MG","IBGP • 2015"),
                      ("https://www.pciconcursos.com.br/provas/download/cirurgiao-dentista-periodontia-prefeitura-lagoa-santa-mg-ibgp-2015","Cirurgião Dentista — Periodontia — Lagoa Santa/MG","IBGP • 2015"),
                  ]
                  pci_html="".join(
                      f'<a class="pdf-item" href="{u}" target="_blank" rel="noopener"><span class="pdf-mark">PCI</span><span class="lesson-text"><strong>{t}</strong><small>{d} • PCI Concursos • prova + gabarito</small></span><span class="lesson-open">Prova + gabarito</span></a>'
                      for u,t,d in pci
                  )
                  extra=f'''<div class="area-grid" id="jr-semusa-odonto-20261003" style="padding-top:0">
                    <div class="list-box">
                      <div class="box-head"><strong>🎯 Foco do edital • Odontólogo 514</strong><span>SEMUSA 25/2026</span></div>
                      <div class="scroll-list">{focus_html}</div>
                    </div>
                    <div class="list-box">
                      <div class="box-head"><strong>📝 Provas anteriores • IBGP • Odontologia</strong><span>PCI Concursos</span></div>
                      <div class="scroll-list">{pci_html}</div>
                    </div>
                  </div>'''
                  sec=sec+extra
              html=html[:os]+sec+html[oe:]
              changed.append("odontologia-semusa")

          configs=[
            ("farmaceutico","jr-ibgp-farmacia-20261002","IBGP • Farmácia",[
              item(f"{E}/prova/ibgp-2018-prefeitura-de-itabira-mg-tecnico-superior-de-saude-farmaceutico-prova.pdf","Farmacêutico — Itabira/MG","IBGP • 2018 • PDF direto validado","PROVA"),
              item(f"{E}/gabarito/ibgp-2018-prefeitura-de-itabira-mg-tecnico-superior-de-saude-farmaceutico-gabarito.pdf","Gabarito — Farmacêutico — Itabira/MG","IBGP • 2018 • PDF direto validado","GAB"),
              item(f"{E}/prova/ibgp-2021-prefeitura-de-sao-joao-del-rei-mg-farmaceutico-bioquimico-prova.pdf","Farmacêutico Bioquímico — São João del-Rei/MG","IBGP • 2021 • PDF direto","PROVA"),
              item(f"{E}/gabarito/ibgp-2021-prefeitura-de-sao-joao-del-rei-mg-farmaceutico-bioquimico-gabarito.pdf","Gabarito — Farmacêutico Bioquímico","IBGP • 2021 • PDF direto","GAB"),
            ]),
            ("nutricao","jr-ibgp-nutricao-20261002","IBGP • Nutrição",[
              item(f"{E}/prova/ibgp-2018-prefeitura-de-itabira-mg-tecnico-superior-de-saude-nutricionista-prova.pdf","Nutricionista — Itabira/MG","IBGP • 2018 • PDF direto validado","PROVA"),
              item(f"{E}/gabarito/ibgp-2018-prefeitura-de-itabira-mg-tecnico-superior-de-saude-nutricionista-gabarito.pdf","Gabarito — Nutricionista — Itabira/MG","IBGP • 2018 • PDF direto validado","GAB"),
            ]),
            ("fisioterapia","jr-ibgp-fisio-20261002","IBGP • Fisioterapia",[
              item(f"{E}/prova/ibgp-2018-prefeitura-de-itabira-mg-tecnico-superior-de-saude-fisioterapeuta-prova.pdf","Fisioterapeuta — Itabira/MG","IBGP • 2018 • PDF direto validado","PROVA"),
              item(f"{E}/gabarito/ibgp-2018-prefeitura-de-itabira-mg-tecnico-superior-de-saude-fisioterapeuta-gabarito.pdf","Gabarito — Fisioterapeuta — Itabira/MG","IBGP • 2018 • PDF direto validado","GAB"),
            ]),
            ("psicologia","jr-ibgp-psico-20261002","IBGP • Psicologia",[
              item(f"{E}/prova/ibgp-2018-prefeitura-de-itabira-mg-tecnico-superior-de-saude-psicologo-prova.pdf","Psicólogo — Itabira/MG","IBGP • 2018 • PDF direto validado","PROVA"),
              item(f"{E}/gabarito/ibgp-2018-prefeitura-de-itabira-mg-tecnico-superior-de-saude-psicologo-gabarito.pdf","Gabarito — Psicólogo — Itabira/MG","IBGP • 2018 • PDF direto validado","GAB"),
            ]),
            ("enfermagem","jr-ibgp-enfermagem-20261002","IBGP • Enfermagem",[
              item(f"{E}/prova/ibgp-2021-prefeitura-de-dores-do-indaia-mg-enfermeiro-prova.pdf","Enfermeiro — Dores do Indaiá/MG","IBGP • 2021 • PDF direto validado","PROVA"),
              item(f"{E}/gabarito/ibgp-2021-prefeitura-de-dores-do-indaia-mg-enfermeiro-gabarito.pdf","Gabarito — Enfermeiro — Dores do Indaiá/MG","IBGP • 2021 • PDF direto validado","GAB"),
            ]),
            ("tecnico","jr-ibgp-tecnico-enf-20261002","IBGP • Técnico em Enfermagem",[
              item(f"{E}/prova/ibgp-2021-prefeitura-de-dores-do-indaia-mg-tecnico-em-enfermagem-prova.pdf","Técnico em Enfermagem — Dores do Indaiá/MG","IBGP • 2021 • PDF direto validado","PROVA"),
              item(f"{E}/gabarito/ibgp-2021-prefeitura-de-dores-do-indaia-mg-tecnico-em-enfermagem-gabarito.pdf","Gabarito — Técnico em Enfermagem","IBGP • 2021 • PDF direto validado","GAB"),
            ]),
            ("odontologia","jr-ibgp-odonto-20261002","IBGP • Odontologia",[
              item(f"{E}/prova/ibgp-2021-prefeitura-de-dores-do-indaia-mg-odontologo-prova.pdf","Odontólogo — Dores do Indaiá/MG","IBGP • 2021 • PDF direto validado","PROVA"),
              item(f"{E}/gabarito/ibgp-2021-prefeitura-de-dores-do-indaia-mg-odontologo-gabarito.pdf","Gabarito — Odontólogo — Dores do Indaiá/MG","IBGP • 2021 • PDF direto validado","GAB"),
            ]),
            ("biomedicina","jr-ibgp-biomed-correlata-20261002","IBGP • Bioquímica/Laboratório — prova correlata",[
              item(f"{E}/prova/ibgp-2021-prefeitura-de-dores-do-indaia-mg-bioquimico-prova.pdf","Bioquímico — Dores do Indaiá/MG","IBGP • 2021 • correlata; não é prova específica de Biomédico","PROVA"),
              item(f"{E}/gabarito/ibgp-2021-prefeitura-de-dores-do-indaia-mg-bioquimico-gabarito.pdf","Gabarito — Bioquímico — Dores do Indaiá/MG","IBGP • 2021 • material correlato","GAB"),
            ]),
            ("laboratorio","jr-ibgp-lab-correlata-20261002","IBGP • Laboratório/Bioquímica — prova correlata",[
              item(f"{E}/prova/ibgp-2021-prefeitura-de-dores-do-indaia-mg-bioquimico-prova.pdf","Bioquímico — Dores do Indaiá/MG","IBGP • 2021 • correlata para treino de laboratório","PROVA"),
              item(f"{E}/gabarito/ibgp-2021-prefeitura-de-dores-do-indaia-mg-bioquimico-gabarito.pdf","Gabarito — Bioquímico — Dores do Indaiá/MG","IBGP • 2021 • material correlato","GAB"),
            ]),
            ("acsfiscal","jr-ibgp-acs-ace-20261002","IBGP • ACS e Endemias",[
              item(f"{E}/prova/ibgp-2017-prefeitura-de-andradas-mg-agente-de-combate-a-endemias-prova.pdf","Agente de Combate a Endemias — Andradas/MG","IBGP • 2017 • PDF direto validado","PROVA"),
              item(f"{E}/gabarito/ibgp-2017-prefeitura-de-andradas-mg-agente-de-combate-a-endemias-gabarito.pdf","Gabarito — Agente de Combate a Endemias","IBGP • 2017 • PDF direto validado","GAB"),
              item(f"{E}/prova/ibgp-2017-prefeitura-de-andradas-mg-agente-comunitario-de-saude-prova.pdf","Agente Comunitário de Saúde — Andradas/MG","IBGP • 2017 • PDF direto validado","PROVA"),
              item(f"{E}/gabarito/ibgp-2017-prefeitura-de-andradas-mg-agente-comunitario-de-saude-gabarito.pdf","Gabarito — Agente Comunitário de Saúde","IBGP • 2017 • PDF direto validado","GAB"),
            ]),
            ("clinico","jr-ibgp-medicina-pci-20261002","IBGP • Medicina • PCI Concursos",[
              item("https://arq.pciconcursos.com.br/provas/22752325/49175f80b134/3_ibgp_medico_clinico.pdf","Médico Clínico — IBGP","PCI Concursos • PDF direto","PROVA"),
              item("https://arq.pciconcursos.com.br/provas/22752325/0b594ee55738/gab_preliminar.pdf","Gabarito — Médico Clínico — IBGP","PCI Concursos • PDF direto","GAB"),
              item("https://arq.pciconcursos.com.br/provas/22753469/f6808c01b414/6_ibgp_medico.pdf","Médico — IBGP","PCI Concursos • PDF direto","PROVA"),
              item("https://arq.pciconcursos.com.br/provas/22753469/074f078c0a55/gab_preliminar.pdf","Gabarito — Médico — IBGP","PCI Concursos • PDF direto","GAB"),
              item("https://arq.pciconcursos.com.br/provas/22751736/77ca15cdd858/2_ibgp_medico_cardiologia.pdf","Médico Cardiologia — IBGP","PCI Concursos • PDF direto • treino adicional","PROVA"),
              item("https://arq.pciconcursos.com.br/provas/22751736/368c54cb67d4/gab_preliminar.pdf","Gabarito — Médico Cardiologia — IBGP","PCI Concursos • PDF direto","GAB"),
            ]),
          ]

          for area,marker,title,items in configs:
              if add(area,marker,block(marker,title,items)):
                  changed.append(area)

          # Radiologia: mantém PDFs PCI já presentes e adiciona referência IBGP exata
          # sem fingir que os PDFs genéricos existentes são da IBGP.
          rad_marker="jr-ibgp-radiologia-ref-20261002"
          rad=block(rad_marker,"IBGP • Radiologia — referência da prova",[
              item("https://www.pciconcursos.com.br/provas/download/tecnico-em-radiologia-radiologia-odontologica-prefeitura-lagoa-santa-mg-ibgp-2015","Técnico em Radiologia — Lagoa Santa/MG","IBGP • 2015 • referência PCI; PDF final protegido por verificação do PCI","PCI"),
          ])
          if add("radiologia",rad_marker,rad):
              changed.append("radiologia")

          if not changed:
              print("Nenhuma alteração necessária.")
          else:
              # Verificações de sanidade.
              required=["farmaceutico","nutricao","fisioterapia","psicologia","enfermagem","tecnico","odontologia","clinico","acsfiscal"]
              for a in required:
                  if f'id="area-{a}"' not in html:
                      raise SystemExit("Área ausente após patch: "+a)
              if 'jr-ibgp-medicina-pci-20261002' not in html:
                  raise SystemExit("Bloco Medicina não inserido")
              p.write_text(html,encoding="utf-8")
              print("Atualizados:", ", ".join(changed))
          PY

      - name: Commit patched index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git config user.name "JR Aprova Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add IBGP exam pairs across SEMUSA health blocks"
          git push origin main
