name: Finalize Farmacia SEMUSA

on:
  push:
    paths:
      - '.github/workflows/patch-pharmacy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Finalizar bloco Farmacia SEMUSA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          start = text.find('<section class="area" id="area-farmaceutico">')
          end = text.find('<section class="area"', start + 40)
          if start < 0 or end < 0:
              raise SystemExit("Bloco Farmacêutico não encontrado")

          sec = text[start:end]

          # Remove conteúdo local de Ji-Paraná do bloco direcionado à SEMUSA.
          for n in range(50, 56):
              sec = re.sub(
                  rf'<button class="lesson-item"[^>]*data-area="farmaceutico"[^>]*data-title="Aula {n} - [^"]*"[^>]*>[\s\S]*?</button>\s*',
                  '',
                  sec,
                  count=1
              )

          sec = sec.replace(
              '<div class="box-head"><strong>Aulas da área</strong><span>63 aulas</span></div>',
              '<div class="box-head"><strong>Aulas complementares da área</strong><span>57 aulas</span></div>'
          )

          priority = '''<div class="list-box">
            <div class="box-head"><strong>🔥 Trilha de videoaulas • SEMUSA Farmácia</strong><span>8 prioridades</span></div>
            <div class="scroll-list">
              <button class="lesson-item" type="button" data-area="farmaceutico" data-embed="https://www.youtube.com/embed/4yv2zII7jWw" data-title="SEMUSA 01 - Princípios e Diretrizes do SUS" data-note="SUS — conteúdo do Edital 25/2026" data-yt="https://www.youtube.com/watch?v=4yv2zII7jWw"><span class="lesson-mark">▶</span><span class="lesson-text"><strong>SEMUSA 01 - Princípios e Diretrizes do SUS</strong><small>Base obrigatória do edital</small></span><span class="lesson-open lesson-status">Prioritária</span></button>
              <button class="lesson-item" type="button" data-area="farmaceutico" data-embed="https://www.youtube.com/embed/YJaEz2qBveY" data-title="SEMUSA 02 - Revisão SUS" data-note="Revisão objetiva de SUS" data-yt="https://www.youtube.com/watch?v=YJaEz2qBveY"><span class="lesson-mark">▶</span><span class="lesson-text"><strong>SEMUSA 02 - Revisão SUS</strong><small>Fixação dos pontos mais cobrados</small></span><span class="lesson-open lesson-status">Prioritária</span></button>
              <button class="lesson-item" type="button" data-area="farmaceutico" data-embed="https://www.youtube.com/embed/mHqEcokB2hI" data-title="SEMUSA 03 - Sistema Nacional de Vigilância Sanitária" data-note="Vigilância sanitária" data-yt="https://www.youtube.com/watch?v=mHqEcokB2hI&t=12s"><span class="lesson-mark">▶</span><span class="lesson-text"><strong>SEMUSA 03 - Sistema Nacional de Vigilância Sanitária</strong><small>Vigilância em saúde e organização sanitária</small></span><span class="lesson-open lesson-status">Prioritária</span></button>
              <button class="lesson-item" type="button" data-area="farmaceutico" data-embed="https://www.youtube.com/embed/oJoylP9sNB8" data-title="SEMUSA 04 - Vigilância Epidemiológica" data-note="Vigilância epidemiológica" data-yt="https://www.youtube.com/watch?v=oJoylP9sNB8"><span class="lesson-mark">▶</span><span class="lesson-text"><strong>SEMUSA 04 - Vigilância Epidemiológica</strong><small>Conteúdo expresso no edital</small></span><span class="lesson-open lesson-status">Prioritária</span></button>
              <button class="lesson-item" type="button" data-area="farmaceutico" data-embed="https://www.youtube.com/embed/i-36FxEcqiQ" data-title="SEMUSA 05 - Inspeção Sanitária x Vigilância Sanitária" data-note="Vigilância sanitária" data-yt="https://www.youtube.com/watch?v=i-36FxEcqiQ"><span class="lesson-mark">▶</span><span class="lesson-text"><strong>SEMUSA 05 - Inspeção Sanitária x Vigilância Sanitária</strong><small>Diferenças conceituais e operacionais</small></span><span class="lesson-open lesson-status">Prioritária</span></button>
              <button class="lesson-item" type="button" data-area="farmaceutico" data-embed="https://www.youtube.com/embed/R7Gl173xdek" data-title="SEMUSA 06 - Biossegurança" data-note="Biossegurança aplicada à saúde" data-yt="https://www.youtube.com/watch?v=R7Gl173xdek"><span class="lesson-mark">▶</span><span class="lesson-text"><strong>SEMUSA 06 - Biossegurança</strong><small>Conteúdo específico do cargo 509</small></span><span class="lesson-open lesson-status">Prioritária</span></button>
              <button class="lesson-item" type="button" data-area="farmaceutico" data-embed="https://www.youtube.com/embed/136V2fz02G8" data-title="SEMUSA 07 - Introdução à Biossegurança" data-note="Revisão de biossegurança" data-yt="https://www.youtube.com/watch?v=136V2fz02G8"><span class="lesson-mark">▶</span><span class="lesson-text"><strong>SEMUSA 07 - Introdução à Biossegurança</strong><small>Reforço para fixação</small></span><span class="lesson-open lesson-status">Prioritária</span></button>
              <button class="lesson-item" type="button" data-area="farmaceutico" data-embed="https://www.youtube.com/embed/videoseries?list=PLGo3_Q7AW0LaSquGYX5WG3p6cNaW8PLnm&index=19" data-title="SEMUSA 08 - Segurança do Paciente" data-note="Segurança do paciente e prevenção de erros" data-yt="https://www.youtube.com/playlist?list=PLGo3_Q7AW0LaSquGYX5WG3p6cNaW8PLnm&index=19"><span class="lesson-mark">▶</span><span class="lesson-text"><strong>SEMUSA 08 - Segurança do Paciente</strong><small>Segurança do paciente e erros de medicação</small></span><span class="lesson-open lesson-status">Prioritária</span></button>
            </div>
          </div>

          '''
          marker = '<div class="list-box">\n  <div class="box-head"><strong>Trilha SEMUSA • Farmacêutico 509</strong>'
          if 'Trilha de videoaulas • SEMUSA Farmácia' not in sec:
              if marker not in sec:
                  raise SystemExit("Trilha SEMUSA não encontrada")
              sec = sec.replace(marker, priority + marker, 1)

          exams = '''<div class="list-box">
            <div class="box-head"><strong>📝 IBGP • Provas anteriores de Farmácia</strong><span>Prova + gabarito</span></div>
            <div class="scroll-list">
              <a class="pdf-item" href="https://eticaconcursos.com.br/provas/arquivos/prova/ibgp-2021-prefeitura-de-sao-joao-del-rei-mg-farmaceutico-bioquimico-prova.pdf" target="_blank" rel="noopener"><span class="pdf-mark">PROVA</span><span class="lesson-text"><strong>Farmacêutico Bioquímico — São João del-Rei/MG</strong><small>IBGP • 2021 • PDF direto</small></span><span class="lesson-open">Abrir prova</span></a>
              <a class="pdf-item" href="https://eticaconcursos.com.br/provas/arquivos/gabarito/ibgp-2021-prefeitura-de-sao-joao-del-rei-mg-farmaceutico-bioquimico-gabarito.pdf" target="_blank" rel="noopener"><span class="pdf-mark">GAB</span><span class="lesson-text"><strong>Gabarito — Farmacêutico Bioquímico — São João del-Rei/MG</strong><small>IBGP • 2021 • PDF direto</small></span><span class="lesson-open">Abrir gabarito</span></a>
            </div>
          </div>
          '''

          if 'IBGP • Provas anteriores de Farmácia' not in sec:
              anchor = '<div class="list-box">\n  <div class="box-head"><strong>PDFs e materiais • SEMUSA Farmácia</strong>'
              a = sec.find(anchor)
              if a < 0:
                  raise SystemExit("Caixa de PDFs SEMUSA não encontrada")
              # Insere a caixa de provas após a caixa atual de PDFs, usando o fechamento final do bloco.
              tail = sec.rfind('    </div>\n  </div>\n</section>')
              if tail < 0:
                  raise SystemExit("Final da seção Farmácia não encontrado")
              sec = sec[:tail] + exams + sec[tail:]

          updated = text[:start] + sec + text[end:]
          if updated != text:
              path.write_text(updated, encoding="utf-8")
              print("Farmácia finalizada.")
          else:
              print("Nenhuma alteração necessária.")
          PY

      - name: Commit
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git config user.name "JR Aprova Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Finalize SEMUSA pharmacy content and IBGP exam pair"
          git push origin main

# final pharmacy pass 2026-10-02
