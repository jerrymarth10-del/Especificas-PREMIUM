name: Teste Secretaria Escolar SEMED
on:
  push:
    branches: [feat/secretaria-escolar-semed-20261016]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe e testes
        run: |
          node --check lib/secretaria-escolar.js
          node --check lib/secretaria-escolar-access.js
          node --check api/access.js
          node --check api/inject.js
          node scripts/test-secretaria-escolar.cjs
          node scripts/test-cuidador-social.cjs
